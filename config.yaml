# Society AI Watchdog — configuration
# All tunables live here. No hardcoded IPs/tokens/thresholds in code.

cameras:
  # One entry per camera. `url` may be an RTSP URL or a path to a video file
  # (mp4/avi/dav). Use the SUBSTREAM for RTSP (lighter, enough for detection):
  #   Hikvision:        rtsp://user:pass@DVR_IP:554/Streaming/Channels/102
  #   CP Plus / Dahua:  rtsp://user:pass@DVR_IP:554/cam/realmonitor?channel=1&subtype=1
  - name: gate
    url: "tests/sample_gate.mp4"      # replace with your RTSP URL
    loop_file: true                    # loop video files (demo/test mode)
    zones:
      # Polygons as [[x, y], ...] in pixels of the source frame.
      # Draw them with:  python zones.py --camera gate
      entry: []          # A1: unauthorized vehicle entry
      parking: []        # A2: loitering near parked cars
      restricted: []     # A4: restricted-zone entry at odd hours

detection:
  model: "yolo11n.pt"          # nano model; auto-downloads on first run.
                               # For dark/low-res footage use "yolo11s.pt" or
                               # "yolo11m.pt" — much better at small/dim people.
  device: "auto"               # auto | cpu | cuda:0
  imgsz: 640                   # raise to 1280 for tiny/far subjects
  confidence: 0.35             # lower (e.g. 0.15) to keep faint person detections
  low_light: "auto"            # off | auto | on — brighten dark night frames
                               # BEFORE detection so shadowed people are visible
                               # (auto = only when the scene is dim/has dark areas)
  process_fps: 6               # inference rate per camera (frame skipping)
  classes: [person, car, motorcycle, bus, truck, bicycle]
  # Tracker: "bytetrack.yaml" (fast, motion-only, default) or
  # "botsort_reid" (appearance ReID — keeps the same culprit ID across
  # occlusions / re-entry; stronger tracking, ~1.5-2x the tracking cost).
  tracker: "bytetrack.yaml"
  pose_model: "yolo11n-pose.pt"  # stick-figure model; auto-downloads on first use

plates:
  enabled: true
  # Optional dedicated licence-plate detector (YOLO weights). If the file is
  # missing, OCR runs on the lower half of the vehicle crop instead.
  detector_model: "models/license_plate_yolo.pt"
  ocr_backend: "auto"          # auto | fast-plate-ocr | easyocr | none
  ocr_interval_s: 1.0          # OCR at most once per second per tracked vehicle
  min_confidence: 0.5
  fuzzy_max_distance: 1        # Levenshtein distance for registry matching

# Automated gate register — replaces the handwritten visitor book. Every plate
# read on a gate camera opens a visit; the next pass closes it. Needs plates.
visitor_log:
  enabled: true
  cameras: [gate]              # cameras that watch the gate. Empty = all
                               # cameras (only sane on a single-camera setup:
                               # a parking camera would log parked cars).
  debounce_s: 60               # ignore repeat sightings within this window
  min_visit_s: 30              # a car pausing at the gate isn't an exit
  overstay_hours: 12           # unregistered vehicle still inside after this
                               # many hours shows up in /api/visits/overstays

# Parking slots — drawn spaces, optionally assigned to a vehicle. Draw them
# with `python zones.py`, assign them in the console. Nothing here runs until
# at least one slot exists.
slots:
  enabled: true
  occupy_confirm_s: 15         # a car must settle this long to take a space
  vacate_confirm_s: 25         # ...and be gone this long before anyone is told.
                               # This is the number that decides whether the
                               # notification is trusted or muted: the tracker
                               # drops a parked car for a few frames routinely.
  notify_owner: true           # "your car left its spot", to that owner only

# Object Tagging workbench (/train). The segmentation model here is separate
# from the live detector on purpose: the cameras keep running `detection.model`
# and this loads only when someone opens the workbench and asks for outlines.
train:
  segmenter: yolo              # yolo | mock  (mock = deterministic stand-in
                               # shapes, for working on the UI with no model)
  seg_model: "yolo11n-seg.pt"  # ~6MB, downloads on first use, CPU is fine
  seg_confidence: 0.25         # lower than the live detector's on purpose.
                               # This is a labelling tool: a wrong outline is
                               # dismissed with one click, but an object that
                               # was never offered cannot be tagged at all. On
                               # MEVA's car park at 0.35, two of four people
                               # were dropped — they are 16-27px wide where a
                               # car is 200.
  seg_imgsz: 640
  seg_device: "auto"           # auto | cpu | cuda:0
  max_objects: 40              # per frame, so one busy frame cannot flood the UI
  cache_frames: 64             # segmented frames held in memory; disposable

  # Following one object through moving video. Objects do not travel in
  # straight lines, so every gate here is relative to the object's own size
  # rather than a fixed number of pixels — the same rule that loses a car near
  # the camera will happily swap two people at the far end of the car park.
  tracking:
    stride: 2                  # segment every Nth frame. 1 is twice the work
                               # for detail nobody labels at.
    max_frames: 400            # ceiling on one run, so a 5-minute clip cannot
                               # turn into a 40-minute job by accident
    iou_gate: 0.12             # below this overlap it is not the same object
    weak_iou: 0.35             # matched, but worth a person's eye
    distance_gate: 2.2         # in multiples of the object's own radius
    jump_ratio: 1.1            # a step bigger than this, relative to size, is
                               # flagged rather than silently accepted
    area_ratio: 2.6            # a size change this big usually means it merged
    max_gap: 6                 # processed frames we will bridge across before
                               # admitting we lost it
    review_gap: 2              # bridged runs longer than this get flagged

# Threat scoring — replaces the old fixed severity table. Every rule still
# fires; what changes is that a firing is scored 0..1 from the situation and
# only becomes an alert above `dismiss`. Turn `enabled` off to go back to the
# fixed table. Weights are additive on top of the per-type base.
scoring:
  enabled: true
  thresholds:
    dismiss: 0.30              # below this it is not raised at all
    low: 0.45
    medium: 0.65               # at or above -> HIGH
  ai_review_above: 0.55        # only spend money above this
  reference:
    dwell_s: 45                # "a long time to stand still", for this site
  # base:                      # per event type, if a site needs to differ
  #   loitering: 0.34
  # weights:
  #   night: 0.12
  #   registered: -0.34
  #   false_alarms: -0.26

# Rising-edge alerting. Events are ALWAYS recorded; this decides which of them
# are allowed to interrupt a person. One continuing situation should produce
# one alert, plus one more if it gets meaningfully worse — not one every few
# seconds until `max_notifications_per_hour` silences the camera completely.
incidents:
  enabled: true
  cooldown_s: 60             # quiet this long and the next event is a NEW
                             # incident. Wants to be comfortably longer than
                             # the gap the tracker leaves when it loses
                             # somebody behind a vehicle, or one person walking
                             # past a van becomes two incidents and two alerts.
  remind_after_s: 900        # a still-running incident may interrupt again
                             # this rarely, so a long event is not forgotten
  escalate_score_delta: 0.15 # how far the 0..1 score must rise above the
                             # incident's peak to count as "worse". Below this
                             # is jitter, not escalation.
  always_notify:             # never suppressed: these are the reason the
    - camera_tamper          # operator can no longer SEE the incident, not
    - camera_offline         # more of the incident itself

# Retention. Old clips are deleted on a timer, so the box never fills up and no
# resident's footage is kept indefinitely (a DPDP requirement as much as a disk
# one). Only clip FILES are removed, through the audited deletion path; events,
# the audit chain and the registry are never touched.
retention:
  enabled: true
  clip_days: 14                # delete clips older than this, always
  min_free_gb: 2.0             # if the disk is tighter than this, delete the
                               # oldest surviving clips until it is not
  interval_s: 3600             # how often to sweep

# Zero-touch connect. With no cameras configured, the box scans its own network
# on startup, tries the factory-default DVR logins (and any you list here), and
# connects every channel that streams — no file to edit, no page to click. A DVR
# whose password was changed at install will not answer the defaults; add those
# once from the console's Cameras tab and they are remembered.
autoconnect:
  enabled: true
  networks: [auto]             # auto = the /24 this machine is on. Or list them:
                               #   networks: ["192.168.1.0/24"]
  channels: 4                  # channels to try per DVR
  credentials: []              # your own first, e.g.:
                               #   - {username: admin, password: yoursecret}

# Learned normalcy — the system teaching itself what is permanently there.
# A "person" that never moves and is always in the same spot is furniture (a
# fire hydrant, a bollard, a reflection), not a loiterer. On real MEVA footage
# one misdetected hydrant fired a loitering alert every debounce interval; this
# suppressed 97% of those within two minutes of watching, with no human input.
# Events anchored ONLY to learned furniture are dropped; anything moving, and
# every camera-tamper/offline alert, always gets through.
normalcy:
  enabled: true

# The event graph: each tracked person's timeline of observable sub-events
# (entered a zone, approached a vehicle, lingered, reached in), from which a
# sequence like "approached -> stayed -> interacted" is named and handed to the
# fusion layer as one more line of evidence (see app/eventgraph.py). Additive
# and always on; it never raises an alert by itself.
eventgraph:
  refractory_s: 2.0              # collapse a continuing state to one node per 2s
  memory_s: 120                  # forget a track this long after it goes quiet
  dwell_s: 5.0                   # "lingered" means near a vehicle this many seconds

# The behaviour brain: a learned, explainable score for how a person moved near
# a vehicle (see app/brain.py and docs/THE_BRAIN.md). It reads a trained model
# from model_path; if that file does not exist the whole system runs on the
# free layer exactly as before, so this is safe to leave on. Train one with:
#   python -m training.brain_train --features training/data/features.jsonl
# or, for a pipeline self-check on synthetic motion (not a real number):
#   python -m training.brain_train --synth --out models/brain.joblib
brain:
  enabled: true
  model_path: models/brain.joblib
  window_s: 40                   # how far back to look — loitering is a 30-40s story
  infer_every_s: 2.0             # score the hottest pair this often
  min_span_s: 6.0                # need this much motion history before judging

rules:
  night_hours: { start: "23:00", end: "05:00" }
  debounce_s: 120              # one event type per tracked object per N seconds
  max_notifications_per_hour: 10   # per camera; beyond this: log, don't send
  flag_seconds: 60             # how long a culprit stays green-boxed after an anomaly

  unauthorized_vehicle:        # A1
    enabled: true
    plate_read_timeout_s: 5    # after this, alert as "plate unreadable"

  loitering:                   # A2
    enabled: true
    dwell_s: 45
    night_dwell_s: 20
    max_displacement_px: 120   # total movement below this = loitering
    near_vehicle_px: 150       # zone-free fallback: "near a vehicle" radius

  vehicle_contact:             # A3 (best-effort heuristic, noisy — off by default)
    enabled: false             # geometry-only; use Smart AI Review for real theft
    iou_threshold: 0.20        # boxes must genuinely overlap (was too low before)
    depart_window_s: 15
    depart_speed_px_s: 60      # leaving "at speed"

  restricted_zone:             # A4
    enabled: true

  # Candidate trigger — the cheap "worth forwarding to Claude?" gate. Wide net
  # by design (high recall). Tune these against real footage with
  #   python validate_triggers.py
  trigger:
    on_near_vehicle: true      # person close to a vehicle (main theft signal)
    on_loiter: true            # person lingering (dwelling) in view
    on_zone: true              # person inside any drawn zone
    on_night_person: true      # any person present during night hours
    on_pose: true              # stick-figure signals: crouching/reaching/swing
    on_touch: true             # person actually overlapping a vehicle
    on_departure: true         # THEFT CHAIN: parked car leaves after activity
    on_break_in: true          # INSTANT HIGH: strike/sustained reach at a car
    on_disturb: true           # pose-free smash detector (pixel burst on car)
    disturb_thresh: 60         # localized peak motion = "violent". Measured on
                               # real night CCTV: quiet ~15, a real break-in
                               # reach-in peaked 90-160. 60 separates them.
    disturb_frames: 2          # bursts must last this many analyzed frames
    disturb_needs_person: true # false = a burst on a parked car fires even when
                               # YOLO can't see the person (small/low-res); it
                               # stays a WATCH signal until the vehicle model
                               # also confirms it (then it becomes an alert)
    near_vehicle_px: 180       # "near a vehicle" radius in pixels
    dwell_s: 8                 # seconds present before "lingering" fires
    touch_arm_s: 3             # sustained touch (s) before it counts as suspicious
    parked_min_s: 6            # car must sit still this long to count as parked
    depart_frac: 0.6           # moved this fraction of its width = departed
    link_s: 600                # link departure to activity up to this many s back
    pose_only_near_vehicle: true  # speed: run pose model only near vehicles
    night_hours: { start: "23:00", end: "05:00" }
    crouch_ratio: 0.32         # pose: lower = stricter crouch detection
    reach_x_ratio: 0.5         # pose: sideways reach threshold (of body width)
    swing_speed_ratio: 1.1     # pose: wrist speed (body-heights/sec) = strike

  tamper:                      # A5
    enabled: true
    dark_threshold: 12         # mean pixel value below = near-black
    bright_threshold: 243      # mean pixel value above = near-white
    blur_threshold: 12.0       # Laplacian variance below = extremely blurred
    condition_hold_s: 5
    offline_alert_s: 30

clips:
  dir: "clips"
  # The evidence clip: minutes before + after the trigger. The product spec is
  # 3 + 3 minutes. The "before" half is served from an in-memory ring buffer, so
  # pre_event_s is a direct memory cost: ~pre_event_s * fps JPEGs per camera
  # (180s * 10fps ≈ 1800 frames ≈ 60-90 MB/camera). 30-60s each is plenty for
  # most sites and far lighter — turn these down if memory is tight.
  pre_event_s: 180             # 3 minutes before the trigger
  post_event_s: 180            # 3 minutes after the trigger
  buffer_s: 200                # rolling in-memory buffer per camera (>= pre_event_s)
  fps: 10                      # stored clip framerate
  # A clip is evidence only when the alert is real. When true, an alert the AI
  # review clears — or an operator marks a false alarm — has its clip discarded
  # instead of stored. Inert without an AI reviewer (no verdict to act on).
  keep_only_confirmed: true

storage:
  db_path: "watchdog.db"
  registry_csv: "registry.csv"

telegram:
  enabled: false               # set true + fill token/chats to go live
  bot_token: "PUT-YOUR-BOT-TOKEN-HERE"
  chat_ids:                    # guard group / manager group / individuals
    guard: ""
    manager: ""
  send_clips: true
  language: "en"               # en | hi (Hindi alerts for guards)
  feedback_buttons: true       # ✅/❌ buttons on alerts; presses are logged
                               # and used to tune the system

vlm:
  enabled: false               # optional Claude keyframe description on alerts
  model: "claude-sonnet-4-6"
  api_key_env: "ANTHROPIC_API_KEY"
  max_keyframes: 6
  # "Smart AI Review" of uploaded videos (Claude watches the footage and reports
  # theft/break-in/vandalism). Needs ANTHROPIC_API_KEY set in the environment.
  review_model: "claude-opus-4-8"   # strongest vision model for scene understanding
  review_max_frames: 24             # keyframes sampled across the clip (more = better story, slightly costlier)

ai_review:                     # LIVE two-tier AI review of triggered events
  enabled: true                # needs ANTHROPIC_API_KEY in the environment
  tier1_model: "claude-haiku-4-5"   # cheap screener (~Rs 0.5/review)
  tier2_model: "claude-opus-4-8"    # strong reviewer, only on escalation
  escalate: true               # tier1 "suspicious" -> tier2 full findings
  cameras: []                  # empty = all cameras; else list camera names
  schedule: "always"           # always | night_only  (cost lever)
  night_hours: { start: "23:00", end: "05:00" }
  max_frames: 10               # keyframes per review (cost lever)
  daily_cap_per_camera: 100    # hard spend brake per camera per 24h
  usd_to_inr: 90.0             # for the dashboard cost meter

analyze:                       # "upload a video and detect anomalies" feature
  enabled: true
  out_dir: "clips/uploads"
  max_upload_mb: 300
  full_fps_video: false        # true = smoother output video but ~4x slower
  debug_overlay: true          # burn free-layer signal values into the video
  incident_gap_s: 20           # merge alerts within this many seconds into ONE
                               # incident (so a theft shows as 1 event, not many)

hybrid:                        # VisionGuard hybrid: specialist R3D-18 models +
                               # temporal confirmation + explainable fusion.
                               # The free layer runs with this fully disabled;
                               # turn it on only once the .pt weights are present.
  specialist:                  # learned evidence models (app.specialist)
    enabled: false             # master switch — false = free layer only
    device: "auto"             # auto | cpu | cuda:0
    break_in:                  # P(HOUSE_BREAK_IN) from the UCF binary model
      weights: "models/visionguard_ucf_binary_v3.pt"
      classes: ["HOUSE_BREAK_IN", "NORMAL"]   # MUST match training label order
      suspicious_class: "HOUSE_BREAK_IN"
    vehicle:                   # P(VEHICLE_THEFT_OR_TAMPERING)
      weights: "models/visionguard_vehicle_security_v2.pt"
      classes: ["NORMAL_VEHICLE_ACTIVITY", "VEHICLE_THEFT_OR_TAMPERING"]
      suspicious_class: "VEHICLE_THEFT_OR_TAMPERING"
    clip_seconds: 4.0          # rolling clip fed to the model (do not change)
    infer_every_s: 2.0         # run inference this often (clips overlap)
  temporal:                    # per-(camera,event) confirmation (app.temporal)
    history_size: 3            # latest N overlapping inference windows
    required_hits: 2           # this many must be suspicious
    base_threshold: 0.70       # score >= this = a suspicious vote  (DEV value)
    strong_gate: 0.85          # recent peak must reach this to confirm (DEV value)
    require_strong: true       # enforce the strong-evidence gate (live safeguard)
  # NOTE: 0.70 / 0.85 are development calibration values observed to reduce live
  # false positives — NOT production constants. Re-calibrate on an untouched
  # multi-camera holdout before publishing any accuracy claim.

assistant:                     # Claude tuning chatbot in the dashboard
  enabled: false               # set true + ANTHROPIC_API_KEY to enable
  model: "claude-opus-4-8"
  api_key_env: "ANTHROPIC_API_KEY"

dashboard:
  host: "0.0.0.0"      # 0.0.0.0 = reachable on the LAN; 127.0.0.1 = this PC only
  port: 8000
  auth:                # HTTP Basic login (browser popup) — OFF; the app has its
    enabled: false     # own VisionGuard login page (YC / 11012235), so this
    username: "admin"  # server-level popup is disabled to avoid a double login.
    password: ""
