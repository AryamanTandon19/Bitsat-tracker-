<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisionGuard — Sign in</title>
<style>
:root{--bg:#050505;--text:#e8ecee;--muted:#9fb2b3;--cyan:#00f2ff;--purple:#b06bff;
 --red:#ff8f84;--surface:rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
 background:radial-gradient(1000px 500px at 30% -10%,rgba(0,242,255,.08),transparent),
 radial-gradient(900px 500px at 90% 110%,rgba(176,107,255,.08),transparent),var(--bg);
 color:var(--text)}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid rgba(255,255,255,.1);
 border-radius:18px;padding:34px 30px;backdrop-filter:blur(8px)}
.brand{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.brand b{color:var(--cyan)}
.tag{color:var(--muted);font-size:12px;margin-bottom:26px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.14em;
 color:var(--muted);margin:16px 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;font-size:14px;color:var(--text);
 background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14);outline:none}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,242,255,.12)}
button{width:100%;margin-top:24px;padding:13px;border:none;border-radius:10px;cursor:pointer;
 font-size:14px;font-weight:700;color:#04222a;
 background:linear-gradient(135deg,var(--cyan) 0%,var(--purple) 100%)}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:16px;font-size:12.5px;min-height:18px;color:var(--red)}
.foot{margin-top:22px;font-size:11px;color:var(--muted);text-align:center;opacity:.7}
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand">Vision<b>Guard</b></div>
    <div class="tag">Investor preview — please sign in</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Sign in</button>
    <div class="msg" id="msg"></div>
    <div class="foot">Access is by invitation. Contact the founder for a login.</div>
  </form>

  <script src="config.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const cfg = window.VISIONGUARD_CONFIG;
    const supabase = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    // already signed in? go straight to the app
    const { data: { session } } = await supabase.auth.getSession();
    if (session) location.replace("app.html");

    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "";
      btn.disabled = true; btn.textContent = "Signing in…";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        msg.textContent = error.message || "Sign-in failed.";
        btn.disabled = false; btn.textContent = "Sign in";
      } else {
        location.replace("app.html");
      }
    });
  </script>
</body>
</html>
